<!--
  PASTE THIS INTO GAM AS A CUSTOM CREATIVE (size 1x1)
  Delivery -> Creatives -> New creative -> Custom
    - Size: 1x1
    - UNTICK "Serve into a SafeFrame"   (required - lets the creative reach the page)
  Then fill in the 3 values in SETTINGS below.
-->
<script>
(function () {
  /* ============ SETTINGS ============ */
  // 1) Where dawn-player.js is hosted (Dawn's server/CDN). For the local test leave as is.
  var PLAYER_JS  = '/dawn-player.js';
  // 2) The VAST tag of your GAM VIDEO ad unit (not the 1x1 unit!)
  var VIDEO_AD_TAG = 'https://pubads.g.doubleclick.net/gampad/ads?sz=1x1|300x250|640x480|640x480|300x250&iu=/1029551/dawn_video_preroll&env=vp&impl=s&gdfp_req=1&output=vast&unviewed_position_start=1&url=[referrer_url]&description_url=[description_url]&correlator=[timestamp]';
  // 3) The video to play
  var VIDEO_URL  = '/carrick.mp4';
  /* ================================== */

  var page, frame;
  try {
    page  = window.parent;
    frame = window.frameElement;
    page.document;                       // throws if SafeFrame is still on
  } catch (e) {
    return;                              // can't reach the page - do nothing
  }
  if (!frame) return;

  // The 1x1 slot <div> on the page; the player is placed inside it.
  var slotDiv = frame.closest('[id]') || frame.parentNode;
  frame.style.display = 'none';          // hide the 1x1 pixel itself

  function go() {
    page.DawnPlayer.mount(slotDiv, { adTagUrl: VIDEO_AD_TAG, contentUrl: VIDEO_URL });
  }
  if (page.DawnPlayer) { go(); return; }
  var s = page.document.createElement('script');
  s.src = PLAYER_JS;
  s.onload = go;
  page.document.head.appendChild(s);
})();
</script>
